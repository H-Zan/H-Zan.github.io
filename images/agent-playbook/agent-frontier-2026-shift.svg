<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350">
  <defs>
    <marker id="arr-a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2bbc8a"/>
    </marker>
    <linearGradient id="bg-a5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#22262b"/>
    </linearGradient>
  </defs>
  <rect width="880" height="350" rx="12" fill="url(#bg-a5)" stroke="#363b42" stroke-width="1.5"/>
  <text x="440" y="32" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16" font-weight="700">2026 Agent 架构大转向：告别“多 Agent 过家家”，拥抱单循环 + Harness 工程</text>

  <!-- Top evolution bar -->
  <rect x="28" y="52" width="248" height="46" rx="6" fill="#24272b" stroke="#6c757d"/>
  <text x="152" y="72" text-anchor="middle" fill="#9aa0a6" font-family="monospace" font-size="11" font-weight="700">2024 · PROMPT ENGINEERING</text>
  <text x="152" y="89" text-anchor="middle" fill="#c9cacc" font-family="sans-serif" font-size="10.5">打磨单次提问词句与角色扮演</text>

  <line x1="276" y1="75" x2="310" y2="75" stroke="#2bbc8a" stroke-width="1.8" marker-end="url(#arr-a5)"/>

  <rect x="314" y="52" width="248" height="46" rx="6" fill="#24272b" stroke="#4ea8de"/>
  <text x="438" y="72" text-anchor="middle" fill="#4ea8de" font-family="monospace" font-size="11" font-weight="700">2025 · CONTEXT ENGINEERING</text>
  <text x="438" y="89" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="10.5">控制喂给模型的上下文与记忆</text>

  <line x1="562" y1="75" x2="596" y2="75" stroke="#2bbc8a" stroke-width="1.8" marker-end="url(#arr-a5)"/>

  <rect x="600" y="52" width="252" height="46" rx="6" fill="#1c2b26" stroke="#2bbc8a" stroke-width="1.6"/>
  <text x="726" y="72" text-anchor="middle" fill="#2bbc8a" font-family="monospace" font-size="11" font-weight="700">2026 · HARNESS ENGINEERING</text>
  <text x="726" y="89" text-anchor="middle" fill="#d5ff80" font-family="sans-serif" font-size="10.5">打磨验证闭环、沙箱、Skills 与隔离</text>

  <!-- Left: Old anti-pattern -->
  <rect x="28" y="118" width="398" height="206" rx="10" fill="#291e21" stroke="#e06c75" stroke-width="1.5"/>
  <text x="227" y="144" text-anchor="middle" fill="#e06c75" font-family="sans-serif" font-size="13.5" font-weight="700">✗ 过时误区：硬画“多 Agent 组织架构图”</text>
  <text x="46" y="172" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• PM Agent → 架构师 Agent → 码农 → 测试 → 审稿</text>
  <text x="46" y="196" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• 每次交接（Handoff）都在做有损摘要，细节层层丢失</text>
  <text x="46" y="220" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• 协调开销拖慢 2×，Token 账单暴涨最高达 15×</text>
  <text x="46" y="244" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• 多套提示词互相打架（Frankenprompt），极难排障</text>
  <rect x="46" y="268" width="362" height="38" rx="6" fill="#3a2328"/>
  <text x="227" y="285" text-anchor="middle" fill="#e06c75" font-family="sans-serif" font-size="11" font-weight="700">Google/Stanford 研究：盲目多代理协调损耗</text>
  <text x="227" y="300" text-anchor="middle" fill="#eeeeee" font-family="monospace" font-size="10.5">可令串行推理准确率下降 39% ~ 70%</text>

  <!-- Right: 2026 Winning pattern -->
  <rect x="454" y="118" width="398" height="206" rx="10" fill="#1b2924" stroke="#2bbc8a" stroke-width="1.5"/>
  <text x="653" y="144" text-anchor="middle" fill="#2bbc8a" font-family="sans-serif" font-size="13.5" font-weight="700">✓ 2026 共识：单主循环 + Skills + 按需子代理</text>
  <text x="472" y="172" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• <tspan fill="#2bbc8a" font-weight="700">默认单 Agent 主循环</tspan>：共享连续上下文、极低延迟</text>
  <text x="472" y="196" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• <tspan fill="#38bdf8" font-weight="700">渐进式 Skills（按需加载）</tspan>：方法论放 SKILL.md，不塞爆提示</text>
  <text x="472" y="220" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• <tspan fill="#f0a500" font-weight="700">克制工具数 (&lt;30~50)</tspan>：动作进 MCP/CLI，配强验证门禁</text>
  <text x="472" y="244" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• <tspan fill="#c678dd" font-weight="700">Subagent 只做三件事</tspan>：隔离脏上下文 / 真并行 / 权限隔离</text>
  <rect x="472" y="268" width="362" height="38" rx="6" fill="#223a31"/>
  <text x="653" y="285" text-anchor="middle" fill="#2bbc8a" font-family="sans-serif" font-size="11" font-weight="700">Anthropic 2026.10 指南核心结论</text>
  <text x="653" y="300" text-anchor="middle" fill="#d5ff80" font-family="monospace" font-size="10.5">“用子代理隔离上下文，而不是用来搭虚拟公司组织架构”</text>
</svg>
