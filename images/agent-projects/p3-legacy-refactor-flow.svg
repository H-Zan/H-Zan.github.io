<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310">
  <defs>
    <marker id="arr-pr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f0a500"/>
    </marker>
    <linearGradient id="bg-pr3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#22262b"/>
    </linearGradient>
  </defs>
  <rect width="880" height="310" rx="12" fill="url(#bg-pr3)" stroke="#363b42" stroke-width="1.5"/>
  <text x="440" y="32" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16" font-weight="700">Project 3 全景：存量复杂老仓库安全改造 4 步手术法</text>

  <rect x="24" y="68" width="194" height="172" rx="8" fill="#24272b" stroke="#c678dd" stroke-width="1.5"/>
  <text x="121" y="92" text-anchor="middle" fill="#c678dd" font-family="monospace" font-size="11.5" font-weight="700">01 · 只读隔离摸底</text>
  <text x="40" y="118" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• 派只读 Subagent 扫描</text>
  <text x="40" y="140" fill="#c9cacc" font-family="sans-serif" font-size="11">  目录、依赖、构建、坑点</text>
  <text x="40" y="166" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• 写下红线 `AGENTS.md`</text>
  <text x="40" y="188" fill="#c9cacc" font-family="sans-serif" font-size="11">  明确禁区与禁止改动目录</text>
  <text x="40" y="220" fill="#c678dd" font-family="monospace" font-size="10">主窗口零垃圾日志污染</text>

  <line x1="218" y1="154" x2="240" y2="154" stroke="#f0a500" stroke-width="2" marker-end="url(#arr-pr3)"/>

  <rect x="244" y="68" width="194" height="172" rx="8" fill="#24272b" stroke="#f0a500" stroke-width="1.5"/>
  <text x="341" y="92" text-anchor="middle" fill="#f0a500" font-family="monospace" font-size="11.5" font-weight="700">02 · 先立回归保护网</text>
  <text x="260" y="118" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• 动刀前先补特性测试</text>
  <text x="260" y="140" fill="#c9cacc" font-family="sans-serif" font-size="11">  锁死现有线上正确行为</text>
  <text x="260" y="166" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• 写 15 行校验脚本</text>
  <text x="260" y="188" fill="#c9cacc" font-family="sans-serif" font-size="11">  验零空文件/零坏链/接口200</text>
  <text x="260" y="220" fill="#f0a500" font-family="monospace" font-size="10">铁律：没保护网不准重构</text>

  <line x1="438" y1="154" x2="460" y2="154" stroke="#f0a500" stroke-width="2" marker-end="url(#arr-pr3)"/>

  <rect x="464" y="68" width="194" height="172" rx="8" fill="#24272b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="561" y="92" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="700">03 · 最小变更重构</text>
  <text x="480" y="118" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• Worktree 隔离分支操作</text>
  <text x="480" y="140" fill="#c9cacc" font-family="sans-serif" font-size="11">• 每次只改 1 个小模块</text>
  <text x="480" y="166" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• 每步跑绿立刻 Commit</text>
  <text x="480" y="188" fill="#c9cacc" font-family="sans-serif" font-size="11">• 卡壳 2 轮立刻回滚重开</text>
  <text x="480" y="220" fill="#38bdf8" font-family="monospace" font-size="10">绝不顺手格式化无关代码</text>

  <line x1="658" y1="154" x2="680" y2="154" stroke="#f0a500" stroke-width="2" marker-end="url(#arr-pr3)"/>

  <rect x="684" y="68" width="172" height="172" rx="8" fill="#1e2523" stroke="#2bbc8a" stroke-width="1.6"/>
  <text x="770" y="92" text-anchor="middle" fill="#2bbc8a" font-family="monospace" font-size="11.5" font-weight="700">04 · 独立审查上线</text>
  <text x="700" y="118" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• 新开只读会话审 Diff</text>
  <text x="700" y="140" fill="#c9cacc" font-family="sans-serif" font-size="11">• 核验禁区目录 0 改动</text>
  <text x="700" y="166" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• 线上冒烟 HTTP 200</text>
  <text x="700" y="188" fill="#c9cacc" font-family="sans-serif" font-size="11">• 新坑记入 `AGENTS.md`</text>
  <text x="700" y="220" fill="#d5ff80" font-family="monospace" font-size="10">零事故、可随时回滚</text>

  <text x="440" y="280" text-anchor="middle" fill="#888e96" font-family="sans-serif" font-size="11">老仓库最怕“AI 好心重构却悄悄弄坏旧功能”——靠保护网 + 隔离红线 + 独立审 Diff 彻底根治</text>
</svg>
