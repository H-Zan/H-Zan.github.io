<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360">
  <defs>
    <marker id="arr7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2bbc8a"/>
    </marker>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#22262b"/>
    </linearGradient>
  </defs>
  <rect width="880" height="360" rx="12" fill="url(#bg7)" stroke="#363b42" stroke-width="1.5"/>
  <text x="440" y="32" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16" font-weight="700">大模型推理引擎四大优化支柱 · LLM Inference Optimization Stack</text>

  <!-- Top split: Prefill vs Decode -->
  <rect x="26" y="54" width="404" height="72" rx="8" fill="#1e262c" stroke="#4ea8de" stroke-width="1.5"/>
  <text x="44" y="78" fill="#4ea8de" font-family="monospace" font-size="12" font-weight="700">PHASE 1 · PREFILL (首字延迟 TTFT)</text>
  <text x="44" y="98" fill="#eeeeee" font-family="sans-serif" font-size="11.5">并行处理全部 Prompt → <tspan fill="#d5ff80" font-weight="700">计算密集型 (Compute-Bound)</tspan></text>
  <text x="44" y="116" fill="#9aa0a6" font-family="sans-serif" font-size="10.5">优化：FlashAttention / Chunked Prefill / Prefix Caching</text>

  <rect x="450" y="54" width="404" height="72" rx="8" fill="#2a1f22" stroke="#e06c75" stroke-width="1.5"/>
  <text x="468" y="78" fill="#e06c75" font-family="monospace" font-size="12" font-weight="700">PHASE 2 · DECODE (单字吞吐 TPOT)</text>
  <text x="468" y="98" fill="#eeeeee" font-family="sans-serif" font-size="11.5">逐 Token 自回归生成 → <tspan fill="#f0a500" font-weight="700">显存带宽受限 (Memory-Bound)</tspan></text>
  <text x="468" y="116" fill="#9aa0a6" font-family="sans-serif" font-size="10.5">优化：Continuous Batching / 量化 / 投机解码</text>

  <!-- 4 Pillars Grid -->
  <rect x="26" y="146" width="198" height="172" rx="8" fill="#24272b" stroke="#2bbc8a" stroke-width="1.5"/>
  <text x="125" y="172" text-anchor="middle" fill="#2bbc8a" font-family="monospace" font-size="12" font-weight="700">01 · KV CACHE</text>
  <text x="125" y="192" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12.5" font-weight="700">空间换时间 + 压缩</text>
  <text x="40" y="216" fill="#c9cacc" font-family="sans-serif" font-size="11">• 缓存历史 K/V 避免重算</text>
  <text x="40" y="236" fill="#c9cacc" font-family="sans-serif" font-size="11">• GQA 分组共享 KV 头</text>
  <text x="40" y="256" fill="#c9cacc" font-family="sans-serif" font-size="11">• DeepSeek MLA 低秩压缩</text>
  <text x="40" y="280" fill="#2bbc8a" font-family="monospace" font-size="10.5">→ KV 显存直降 80%~93%</text>
  <text x="40" y="302" fill="#9aa0a6" font-family="sans-serif" font-size="10">长上下文高并发的命脉</text>

  <rect x="236" y="146" width="198" height="172" rx="8" fill="#24272b" stroke="#4ea8de" stroke-width="1.5"/>
  <text x="335" y="172" text-anchor="middle" fill="#4ea8de" font-family="monospace" font-size="12" font-weight="700">02 · PAGEDATTN</text>
  <text x="335" y="192" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12.5" font-weight="700">虚拟内存分页管理</text>
  <text x="250" y="216" fill="#c9cacc" font-family="sans-serif" font-size="11">• 按需分配离散 KV Block</text>
  <text x="250" y="236" fill="#c9cacc" font-family="sans-serif" font-size="11">• 消除预分配 60% 碎片</text>
  <text x="250" y="256" fill="#c9cacc" font-family="sans-serif" font-size="11">• Copy-on-Write 共享前缀</text>
  <text x="250" y="280" fill="#4ea8de" font-family="monospace" font-size="10.5">→ 吞吐量暴涨 2× ~ 4×</text>
  <text x="250" y="302" fill="#9aa0a6" font-family="sans-serif" font-size="10">vLLM / SGLang 核心基石</text>

  <rect x="446" y="146" width="198" height="172" rx="8" fill="#24272b" stroke="#f0a500" stroke-width="1.5"/>
  <text x="545" y="172" text-anchor="middle" fill="#f0a500" font-family="monospace" font-size="12" font-weight="700">03 · QUANTIZATION</text>
  <text x="545" y="192" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12.5" font-weight="700">低比特权重与激活</text>
  <text x="460" y="216" fill="#c9cacc" font-family="sans-serif" font-size="11">• FP16 → FP8 / INT4 (AWQ)</text>
  <text x="460" y="236" fill="#c9cacc" font-family="sans-serif" font-size="11">• 显存搬运量直接减半/四分</text>
  <text x="460" y="256" fill="#c9cacc" font-family="sans-serif" font-size="11">• 保护 1% 异常激活通道</text>
  <text x="460" y="280" fill="#f0a500" font-family="monospace" font-size="10.5">→ 70B 模型 40GB 可跑</text>
  <text x="460" y="302" fill="#9aa0a6" font-family="sans-serif" font-size="10">直接击穿 HBM 带宽瓶颈</text>

  <rect x="656" y="146" width="198" height="172" rx="8" fill="#24272b" stroke="#c678dd" stroke-width="1.5"/>
  <text x="755" y="172" text-anchor="middle" fill="#c678dd" font-family="monospace" font-size="12" font-weight="700">04 · SPECULATIVE</text>
  <text x="755" y="192" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12.5" font-weight="700">投机解码无损加速</text>
  <text x="670" y="216" fill="#c9cacc" font-family="sans-serif" font-size="11">• 小模型/EAGLE 快速起草 k 词</text>
  <text x="670" y="236" fill="#c9cacc" font-family="sans-serif" font-size="11">• 大模型 1 次前向并行验收</text>
  <text x="670" y="256" fill="#c9cacc" font-family="sans-serif" font-size="11">• 拒绝采样保证数学严格同分布</text>
  <text x="670" y="280" fill="#c678dd" font-family="monospace" font-size="10.5">→ 零精度损失提速 2~3×</text>
  <text x="670" y="302" fill="#9aa0a6" font-family="sans-serif" font-size="10">把闲置算力转化为生成速度</text>

  <text x="440" y="344" text-anchor="middle" fill="#888e96" font-family="sans-serif" font-size="11">系统工程铁律：Decode 阶段 GPU 90% 时间都在等显存搬运权重，一切优化本质都在减少 HBM I/O 与显存浪费</text>
</svg>
