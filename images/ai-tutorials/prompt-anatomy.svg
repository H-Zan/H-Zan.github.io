<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#22262b"/>
    </linearGradient>
  </defs>
  <rect width="880" height="340" rx="12" fill="url(#bg2)" stroke="#363b42" stroke-width="1.5"/>
  <text x="440" y="34" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16" font-weight="700">高可靠 Prompt 六层工程结构 · Anatomy of a Production Prompt</text>
  <text x="440" y="54" text-anchor="middle" fill="#9aa0a6" font-family="monospace" font-size="11.5">System Role + Context + Few-Shot + Clear Task + Output Schema + Guardrails</text>

  <!-- Left 6 stacked layers -->
  <rect x="34" y="76" width="510" height="36" rx="6" fill="#24272b" stroke="#2bbc8a" stroke-width="1.4"/>
  <text x="52" y="99" fill="#2bbc8a" font-family="monospace" font-size="12" font-weight="700">L1 · Role &amp; Goal</text>
  <text x="210" y="99" fill="#eeeeee" font-family="sans-serif" font-size="12.5">角色定位与目标边界（你是谁、服务谁、核心原则）</text>

  <rect x="34" y="118" width="510" height="36" rx="6" fill="#24272b" stroke="#4ea8de" stroke-width="1.4"/>
  <text x="52" y="141" fill="#4ea8de" font-family="monospace" font-size="12" font-weight="700">L2 · Context</text>
  <text x="210" y="141" fill="#eeeeee" font-family="sans-serif" font-size="12.5">背景资料与领域事实（用 &lt;context&gt; XML 标签隔离防注入）</text>

  <rect x="34" y="160" width="510" height="36" rx="6" fill="#24272b" stroke="#f0a500" stroke-width="1.4"/>
  <text x="52" y="183" fill="#f0a500" font-family="monospace" font-size="12" font-weight="700">L3 · Few-Shot</text>
  <text x="210" y="183" fill="#eeeeee" font-family="sans-serif" font-size="12.5">2~3 组高质量输入/输出示范（胜过 500 字空洞要求）</text>

  <rect x="34" y="202" width="510" height="36" rx="6" fill="#24272b" stroke="#c678dd" stroke-width="1.4"/>
  <text x="52" y="225" fill="#c678dd" font-family="monospace" font-size="12" font-weight="700">L4 · Task &amp; CoT</text>
  <text x="210" y="225" fill="#eeeeee" font-family="sans-serif" font-size="12.5">明确步骤拆解（先分析/核对，再给最终结论）</text>

  <rect x="34" y="244" width="510" height="36" rx="6" fill="#24272b" stroke="#2bbc8a" stroke-width="1.4"/>
  <text x="52" y="267" fill="#2bbc8a" font-family="monospace" font-size="12" font-weight="700">L5 · Schema</text>
  <text x="210" y="267" fill="#eeeeee" font-family="sans-serif" font-size="12.5">强类型输出规范（JSON Schema / Markdown 表格字段）</text>

  <rect x="34" y="286" width="510" height="36" rx="6" fill="#24272b" stroke="#e06c75" stroke-width="1.4"/>
  <text x="52" y="309" fill="#e06c75" font-family="monospace" font-size="12" font-weight="700">L6 · Guardrails</text>
  <text x="210" y="309" fill="#eeeeee" font-family="sans-serif" font-size="12.5">负向约束与拒答兜底（不确定时说“未知”，禁止臆测）</text>

  <!-- Right comparison panel -->
  <rect x="574" y="76" width="272" height="114" rx="8" fill="#2a1f22" stroke="#e06c75" stroke-width="1.3"/>
  <text x="592" y="100" fill="#e06c75" font-family="sans-serif" font-size="13" font-weight="700">✗ 常见低效写法 (Anti-Pattern)</text>
  <text x="592" y="122" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• “帮我写一份专业一点的总结”</text>
  <text x="592" y="142" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• 缺少受众、长度与输出格式</text>
  <text x="592" y="162" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• 指令与原始数据混在同一段落</text>
  <text x="592" y="180" fill="#9aa0a6" font-family="monospace" font-size="10.5">→ 每次输出风格漂移、难自动化解析</text>

  <rect x="574" y="206" width="272" height="116" rx="8" fill="#1c2b26" stroke="#2bbc8a" stroke-width="1.3"/>
  <text x="592" y="230" fill="#2bbc8a" font-family="sans-serif" font-size="13" font-weight="700">✓ 工程化 Prompt (Production)</text>
  <text x="592" y="252" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• XML 分隔指令与上下文防越狱</text>
  <text x="592" y="272" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• Few-Shot 锁定语气与判断标准</text>
  <text x="592" y="292" fill="#eeeeee" font-family="sans-serif" font-size="11.5">• 强制 JSON/字段输出 + 未知兜底</text>
  <text x="592" y="311" fill="#d5ff80" font-family="monospace" font-size="10.5">→ 稳定、可评测、可直接接入程序</text>
</svg>
