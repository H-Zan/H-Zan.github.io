<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310">
  <defs>
    <linearGradient id="bg-pg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#22262b"/>
    </linearGradient>
  </defs>
  <rect width="880" height="310" rx="12" fill="url(#bg-pg2)" stroke="#363b42" stroke-width="1.5"/>
  <text x="440" y="32" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16" font-weight="700">PostgreSQL 索引家族选型与 MVCC 并发原理 · Indexes &amp; MVCC</text>

  <!-- Left: Index selector -->
  <rect x="24" y="56" width="414" height="226" rx="10" fill="#1f2329" stroke="#4ea8de" stroke-width="1.5"/>
  <text x="231" y="80" text-anchor="middle" fill="#4ea8de" font-family="monospace" font-size="12" font-weight="700">INDEX FAMILIES · 四大核心索引怎么选</text>

  <rect x="42" y="96" width="378" height="38" rx="6" fill="#24272b" stroke="#2bbc8a"/>
  <text x="58" y="120" fill="#eeeeee" font-family="sans-serif" font-size="11.5"><tspan fill="#2bbc8a" font-weight="700">B-Tree (默认)</tspan>：等值 `=`、范围 `&gt;/&lt;`、排序 `ORDER BY`</text>

  <rect x="42" y="142" width="378" height="38" rx="6" fill="#24272b" stroke="#f0a500"/>
  <text x="58" y="166" fill="#eeeeee" font-family="sans-serif" font-size="11.5"><tspan fill="#f0a500" font-weight="700">GIN 倒排索引</tspan>：`JSONB @&gt;`、数组、全文检索 `tsvector`</text>

  <rect x="42" y="188" width="378" height="38" rx="6" fill="#24272b" stroke="#4ea8de"/>
  <text x="58" y="212" fill="#eeeeee" font-family="sans-serif" font-size="11.5"><tspan fill="#4ea8de" font-weight="700">BRIN 块范围</tspan>：亿级按时间递增日志表（体积小 99%）</text>

  <rect x="42" y="234" width="378" height="36" rx="6" fill="#24272b" stroke="#c678dd"/>
  <text x="58" y="257" fill="#eeeeee" font-family="sans-serif" font-size="11.5"><tspan fill="#c678dd" font-weight="700">HNSW (pgvector)</tspan>：高维 AI Embedding 毫秒近似检索</text>

  <!-- Right: MVCC -->
  <rect x="456" y="56" width="400" height="226" rx="10" fill="#1e2523" stroke="#2bbc8a" stroke-width="1.5"/>
  <text x="656" y="80" text-anchor="middle" fill="#2bbc8a" font-family="monospace" font-size="12" font-weight="700">MVCC · 为什么 PG 读写互不阻塞？</text>

  <rect x="476" y="98" width="360" height="52" rx="6" fill="#24272b" stroke="#363b42"/>
  <text x="492" y="120" fill="#eeeeee" font-family="sans-serif" font-size="11.5"><tspan fill="#f0a500" font-weight="700">UPDATE ≠ 原地覆盖</tspan>：PG 写入一行新版本 (Row v2)</text>
  <text x="492" y="139" fill="#9aa0a6" font-family="monospace" font-size="10.5">v1: [xmin=100, xmax=105]   v2: [xmin=105, xmax=∞]</text>

  <rect x="476" y="160" width="360" height="50" rx="6" fill="#24272b" stroke="#2bbc8a"/>
  <text x="492" y="182" fill="#2bbc8a" font-family="sans-serif" font-size="11.5" font-weight="700">快照隔离（Snapshot Isolation）</text>
  <text x="492" y="200" fill="#c9cacc" font-family="sans-serif" font-size="11">读事务看旧版本 v1，写事务改新版本 v2，全程零读锁！</text>

  <rect x="476" y="220" width="360" height="48" rx="6" fill="#2a1f22" stroke="#e06c75"/>
  <text x="492" y="241" fill="#e06c75" font-family="sans-serif" font-size="11.5" font-weight="700">代价 → 死元组 (Dead Tuples)</text>
  <text x="492" y="259" fill="#c9cacc" font-family="sans-serif" font-size="11">靠后台 Autovacuum 定期回收空间，防表膨胀与事务号回卷</text>
</svg>
