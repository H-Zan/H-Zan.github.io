<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300">
  <defs>
    <linearGradient id="bg-p2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#22262b"/>
    </linearGradient>
  </defs>
  <rect width="880" height="300" rx="12" fill="url(#bg-p2)" stroke="#363b42" stroke-width="1.5"/>
  <text x="440" y="32" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16" font-weight="700">Python 并发模型一图选型 · Concurrency Decision Map</text>

  <rect x="26" y="60" width="262" height="196" rx="8" fill="#1e2523" stroke="#2bbc8a" stroke-width="1.6"/>
  <text x="157" y="88" text-anchor="middle" fill="#2bbc8a" font-family="monospace" font-size="13" font-weight="700">asyncio (协程)</text>
  <text x="157" y="108" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12" font-weight="700">单线程事件循环 · 极高并发 I/O</text>
  <text x="42" y="138" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• 并发调 100 个 LLM/HTTP API</text>
  <text x="42" y="160" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• FastAPI / WebSocket / 爬虫</text>
  <text x="42" y="182" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• 切换几乎零开销，内存极低</text>
  <text x="42" y="214" fill="#e06c75" font-family="monospace" font-size="10.5">禁忌：别在 async 里写 time.sleep!</text>
  <text x="42" y="236" fill="#2bbc8a" font-family="monospace" font-size="10.5">工具：httpx.AsyncClient + Semaphore</text>

  <rect x="309" y="60" width="262" height="196" rx="8" fill="#24272b" stroke="#f0a500" stroke-width="1.5"/>
  <text x="440" y="88" text-anchor="middle" fill="#f0a500" font-family="monospace" font-size="13" font-weight="700">ThreadPoolExecutor</text>
  <text x="440" y="108" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12" font-weight="700">多线程 · 同步阻塞库救星</text>
  <text x="325" y="138" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• 旧版不支持 async 的 SDK/驱动</text>
  <text x="325" y="160" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• 磁盘文件读写、轻量网络并发</text>
  <text x="325" y="182" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• 等待 I/O 时会自动释放 GIL</text>
  <text x="325" y="214" fill="#f0a500" font-family="monospace" font-size="10.5">适合：10~50 路同步 I/O 并发</text>
  <text x="325" y="236" fill="#9aa0a6" font-family="monospace" font-size="10.5">注意共享变量线程安全 Lock</text>

  <rect x="592" y="60" width="262" height="196" rx="8" fill="#24272b" stroke="#c678dd" stroke-width="1.5"/>
  <text x="723" y="88" text-anchor="middle" fill="#c678dd" font-family="monospace" font-size="13" font-weight="700">ProcessPoolExecutor</text>
  <text x="723" y="108" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12" font-weight="700">多进程 · 吃满多核 CPU</text>
  <text x="608" y="138" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• 纯 Python 密集计算/解析/压缩</text>
  <text x="608" y="160" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• 每个进程独立解释器绕开 GIL</text>
  <text x="608" y="182" fill="#c9cacc" font-family="sans-serif" font-size="11.5">• 数值计算优先直接用 NumPy/Rust</text>
  <text x="608" y="214" fill="#c678dd" font-family="monospace" font-size="10.5">适合：真正 CPU-Bound 任务</text>
  <text x="608" y="236" fill="#9aa0a6" font-family="monospace" font-size="10.5">注意进程间序列化 (pickle) 开销</text>

  <text x="440" y="284" text-anchor="middle" fill="#888e96" font-family="sans-serif" font-size="11">一句话口诀：等网络用 asyncio，同步库用线程池，纯算力用多进程（或直接调 C/Rust 扩展库）</text>
</svg>
