  <text x="542" y="156" text-anchor="middle" fill="#c9cacc" font-family="sans-serif" font-size="11">Depends(get_db / auth)</text>
  <text x="542" y="178" text-anchor="middle" fill="#c9cacc" font-family="monospace" font-size="10.5">async def + httpx / PG</text>

