<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320">
  <defs>
    <linearGradient id="bg-a4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#22262b"/>
    </linearGradient>
  </defs>
  <rect width="880" height="320" rx="12" fill="url(#bg-a4)" stroke="#363b42" stroke-width="1.5"/>
  <text x="440" y="32" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16" font-weight="700">设计思维 × 工作流思维：用 Agent 搞定 UI 设计与高效职场自动化</text>

  <!-- Left: Design Workflow -->
  <rect x="26" y="56" width="404" height="236" rx="10" fill="#1f2329" stroke="#c678dd" stroke-width="1.5"/>
  <text x="228" y="82" text-anchor="middle" fill="#c678dd" font-family="monospace" font-size="12" font-weight="700">DESIGN THINKING · 用 Agent 做高颜值设计</text>
  <rect x="46" y="98" width="364" height="36" rx="6" fill="#24272b" stroke="#363b42"/>
  <text x="62" y="121" fill="#eeeeee" font-family="sans-serif" font-size="11.5"><tspan fill="#c678dd" font-weight="700">1. 信息架构</tspan>：先定用户核心路径与主次层级，不急着堆特效</text>
  <rect x="46" y="142" width="364" height="36" rx="6" fill="#24272b" stroke="#363b42"/>
  <text x="62" y="165" fill="#eeeeee" font-family="sans-serif" font-size="11.5"><tspan fill="#c678dd" font-weight="700">2. 视觉锚点</tspan>：给参考图 + 色板/字体/间距 Token 锁死调性</text>
  <rect x="46" y="186" width="364" height="36" rx="6" fill="#24272b" stroke="#363b42"/>
  <text x="62" y="209" fill="#eeeeee" font-family="sans-serif" font-size="11.5"><tspan fill="#c678dd" font-weight="700">3. 截图闭环</tspan>：让 Agent 渲染预览 → 截图挑刺 → 精准微调</text>
  <rect x="46" y="230" width="364" height="44" rx="6" fill="#2b2131" stroke="#c678dd" stroke-opacity="0.6"/>
  <text x="228" y="250" text-anchor="middle" fill="#d6a4e8" font-family="sans-serif" font-size="11.5" font-weight="700">关键句式：不要说“不好看”，要说</text>
  <text x="228" y="266" text-anchor="middle" fill="#eeeeee" font-family="monospace" font-size="10.5">“对比度太弱 / 留白翻倍 / 卡片主标题降到 2 行内”</text>

  <!-- Right: Knowledge Work & Reusable Workflows -->
  <rect x="450" y="56" width="404" height="236" rx="10" fill="#1e2523" stroke="#2bbc8a" stroke-width="1.5"/>
  <text x="652" y="82" text-anchor="middle" fill="#2bbc8a" font-family="monospace" font-size="12" font-weight="700">WORKFLOW THINKING · 把重复工作沉淀为资产</text>
  <rect x="470" y="98" width="364" height="36" rx="6" fill="#24272b" stroke="#363b42"/>
  <text x="486" y="121" fill="#eeeeee" font-family="sans-serif" font-size="11.5"><tspan fill="#2bbc8a" font-weight="700">Skills / 指令</tspan>：周报/竞品调研/发版 checklist 固化成模板</text>
  <rect x="470" y="142" width="364" height="36" rx="6" fill="#24272b" stroke="#363b42"/>
  <text x="486" y="165" fill="#eeeeee" font-family="sans-serif" font-size="11.5"><tspan fill="#2bbc8a" font-weight="700">批量文档/数据</tspan>：用 Python + Agent 批处理 CSV/PDF/Markdown</text>
  <rect x="470" y="186" width="364" height="36" rx="6" fill="#24272b" stroke="#363b42"/>
  <text x="486" y="209" fill="#eeeeee" font-family="sans-serif" font-size="11.5"><tspan fill="#2bbc8a" font-weight="700">多源信息聚合</tspan>：MCP 联动 GitHub / 邮件 / 文档自动汇报告</text>
  <rect x="470" y="230" width="364" height="44" rx="6" fill="#1c2f28" stroke="#2bbc8a" stroke-opacity="0.6"/>
  <text x="652" y="250" text-anchor="middle" fill="#2bbc8a" font-family="sans-serif" font-size="11.5" font-weight="700">复利法则：凡是本周做了 2 次以上的同类任务</text>
  <text x="652" y="266" text-anchor="middle" fill="#d5ff80" font-family="monospace" font-size="10.5">→ 立刻封装成 Skill 或脚本，下次 1 句话触发！</text>
</svg>
