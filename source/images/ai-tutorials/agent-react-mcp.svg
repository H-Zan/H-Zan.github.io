<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2bbc8a"/>
    </marker>
    <marker id="arr4o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f0a500"/>
    </marker>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#22262b"/>
    </linearGradient>
  </defs>
  <rect width="880" height="350" rx="12" fill="url(#bg4)" stroke="#363b42" stroke-width="1.5"/>
  <text x="440" y="32" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16" font-weight="700">AI Agent ReAct 闭环与 MCP 工具协议架构 · Agent Loop &amp; MCP</text>

  <!-- User Goal -->
  <rect x="28" y="138" width="126" height="74" rx="8" fill="#24272b" stroke="#4ea8de" stroke-width="1.5"/>
  <text x="91" y="166" text-anchor="middle" fill="#4ea8de" font-family="monospace" font-size="11" font-weight="700">USER GOAL</text>
  <text x="91" y="188" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12.5" font-weight="700">复杂任务目标</text>

  <line x1="154" y1="175" x2="196" y2="175" stroke="#2bbc8a" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- ReAct Loop Container -->
  <rect x="200" y="64" width="320" height="244" rx="10" fill="#1e2422" stroke="#2bbc8a" stroke-width="1.6"/>
  <text x="360" y="88" text-anchor="middle" fill="#2bbc8a" font-family="monospace" font-size="12" font-weight="700">AGENT RUNTIME · ReAct 推理循环</text>

  <!-- Thought -->
  <rect x="228" y="104" width="264" height="46" rx="6" fill="#24272b" stroke="#c678dd" stroke-width="1.4"/>
  <text x="360" y="124" text-anchor="middle" fill="#c678dd" font-family="sans-serif" font-size="12.5" font-weight="700">1. Thought · 规划与推理 (LLM)</text>
  <text x="360" y="141" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="10.5">拆解子目标，决定调用哪个工具或直接回答</text>

  <line x1="360" y1="150" x2="360" y2="174" stroke="#2bbc8a" stroke-width="1.8" marker-end="url(#arr4)"/>

  <!-- Action -->
  <rect x="228" y="178" width="264" height="46" rx="6" fill="#24272b" stroke="#f0a500" stroke-width="1.4"/>
  <text x="360" y="198" text-anchor="middle" fill="#f0a500" font-family="sans-serif" font-size="12.5" font-weight="700">2. Action · 发出结构化 Tool Call</text>
  <text x="360" y="215" text-anchor="middle" fill="#9aa0a6" font-family="monospace" font-size="10">{"tool": "sql_query", "args": {...}}</text>

  <line x1="360" y1="224" x2="360" y2="248" stroke="#2bbc8a" stroke-width="1.8" marker-end="url(#arr4)"/>

  <!-- Observation -->
  <rect x="228" y="252" width="264" height="42" rx="6" fill="#24272b" stroke="#4ea8de" stroke-width="1.4"/>
  <text x="360" y="271" text-anchor="middle" fill="#4ea8de" font-family="sans-serif" font-size="12.5" font-weight="700">3. Observation · 接收环境反馈并写入记忆</text>
  <text x="360" y="286" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="10">若任务未完成 → 回到 Thought 继续迭代</text>

  <!-- Loop back arrow inside container -->
  <path d="M 228 273 L 212 273 L 212 127 L 224 127" fill="none" stroke="#2bbc8a" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr4)"/>

  <!-- MCP Bridge -->
  <rect x="556" y="128" width="96" height="106" rx="8" fill="#2c2419" stroke="#f0a500" stroke-width="1.6"/>
  <text x="604" y="156" text-anchor="middle" fill="#f0a500" font-family="monospace" font-size="13" font-weight="700">MCP</text>
  <text x="604" y="176" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="11.5" font-weight="700">统一协议层</text>
  <text x="604" y="196" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="10">AI 的 USB-C</text>
  <text x="604" y="214" text-anchor="middle" fill="#9aa0a6" font-family="monospace" font-size="9.5">JSON-RPC 2.0</text>

  <line x1="492" y1="196" x2="552" y2="176" stroke="#f0a500" stroke-width="1.8" marker-end="url(#arr4o)"/>
  <line x1="556" y1="205" x2="496" y2="266" stroke="#2bbc8a" stroke-width="1.8" marker-end="url(#arr4)"/>

  <!-- Tool Ecosystem -->
  <rect x="688" y="72" width="164" height="52" rx="6" fill="#24272b" stroke="#363b42"/>
  <text x="770" y="95" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12" font-weight="700">📂 文件与代码沙箱</text>
  <text x="770" y="113" text-anchor="middle" fill="#9aa0a6" font-family="monospace" font-size="10">Git / Shell / Python</text>

  <rect x="688" y="136" width="164" height="52" rx="6" fill="#24272b" stroke="#363b42"/>
  <text x="770" y="159" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12" font-weight="700">🗄️ 数据库与 RAG</text>
  <text x="770" y="177" text-anchor="middle" fill="#9aa0a6" font-family="monospace" font-size="10">SQL / Vector / API</text>

  <rect x="688" y="200" width="164" height="52" rx="6" fill="#24272b" stroke="#363b42"/>
  <text x="770" y="223" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12" font-weight="700">🌐 浏览器与 SaaS</text>
  <text x="770" y="241" text-anchor="middle" fill="#9aa0a6" font-family="monospace" font-size="10">Search / Slack / Mail</text>

  <rect x="688" y="264" width="164" height="44" rx="6" fill="#2a1f22" stroke="#e06c75"/>
  <text x="770" y="290" text-anchor="middle" fill="#e06c75" font-family="sans-serif" font-size="11.5" font-weight="700">🛡️ 权限护栏 &amp; 人工审批</text>

  <line x1="652" y1="156" x2="684" y2="104" stroke="#f0a500" stroke-width="1.4" marker-end="url(#arr4o)"/>
  <line x1="652" y1="175" x2="684" y2="162" stroke="#f0a500" stroke-width="1.4" marker-end="url(#arr4o)"/>
  <line x1="652" y1="196" x2="684" y2="224" stroke="#f0a500" stroke-width="1.4" marker-end="url(#arr4o)"/>

  <text x="440" y="334" text-anchor="middle" fill="#888e96" font-family="sans-serif" font-size="11">核心公式：Agent = LLM (决策脑) + Memory (状态记忆) + Planning (反思规划) + MCP Tools (手和眼)</text>
</svg>
