  <text x="653" y="132" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="10">拆解 DAG 任务 + 上下文裁剪</text>

  <line x1="600" y1="140" x2="532" y2="170" stroke="#2bbc8a" stroke-width="1.5" marker-end="url(#arr8)"/>
  <line x1="653" y1="140" x2="653" y2="170" stroke="#2bbc8a" stroke-width="1.5" marker-end="url(#arr8)"/>
  <line x1="706" y1="140" x2="774" y2="170" stroke="#2bbc8a" stroke-width="1.5" marker-end="url(#arr8)"/>

  <rect x="470" y="174" width="114" height="46" rx="6" fill="#24272b" stroke="#4ea8de"/>
