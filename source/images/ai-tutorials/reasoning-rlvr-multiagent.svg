  <text x="527" y="211" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="9.5">只读检索调研</text>

  <rect x="596" y="174" width="114" height="46" rx="6" fill="#24272b" stroke="#2bbc8a"/>
  <text x="653" y="195" text-anchor="middle" fill="#2bbc8a" font-family="sans-serif" font-size="11.5" font-weight="700">Coder Worker</text>
  <text x="653" y="211" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="9.5">隔离分支修改</text>

  <rect x="722" y="174" width="114" height="46" rx="6" fill="#24272b" stroke="#c678dd"/>
  <text x="779" y="195" text-anchor="middle" fill="#c678dd" font-family="sans-serif" font-size="11.5" font-weight="700">Reviewer</text>
  <text x="779" y="211" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="9.5">独立对抗审查</text>

  <line x1="527" y1="220" x2="610" y2="244" stroke="#2bbc8a" stroke-width="1.4"/>
  <line x1="653" y1="220" x2="653" y2="244" stroke="#2bbc8a" stroke-width="1.4" marker-end="url(#arr8)"/>
  <line x1="779" y1="220" x2="696" y2="244" stroke="#2bbc8a" stroke-width="1.4"/>

  <rect x="470" y="246" width="366" height="50" rx="6" fill="#2a1f22" stroke="#e06c75"/>
  <text x="653" y="267" text-anchor="middle" fill="#e06c75" font-family="sans-serif" font-size="12" font-weight="700">Sandbox Verifier · 确定性沙箱校验（测试/编译/安全）</text>
  <text x="653" y="285" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="10">失败则携带精准日志回传重试，通过才交付最终产物</text>

  <text x="440" y="334" text-anchor="middle" fill="#888e96" font-family="sans-serif" font-size="11">终极共识：无论训练还是推理，“确定性验证环境 (Verifiable Environment)” 才是 AI 突破能力上限的真正杠杆</text>
</svg>
