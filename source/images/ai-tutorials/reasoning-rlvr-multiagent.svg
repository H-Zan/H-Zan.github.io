<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350">
  <defs>
    <marker id="arr8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2bbc8a"/>
    </marker>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#22262b"/>
    </linearGradient>
  </defs>
  <rect width="880" height="350" rx="12" fill="url(#bg8)" stroke="#363b42" stroke-width="1.5"/>
  <text x="440" y="32" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16" font-weight="700">前沿推理范式：RLVR/GRPO 训练闭环与多智能体编排 · Frontier Reasoning &amp; Multi-Agent</text>

  <!-- Left: RLVR / GRPO -->
  <rect x="24" y="56" width="406" height="258" rx="10" fill="#1e2227" stroke="#c678dd" stroke-width="1.5"/>
  <text x="227" y="80" text-anchor="middle" fill="#c678dd" font-family="monospace" font-size="12" font-weight="700">RLVR &amp; GRPO · 可验证奖励强化学习</text>

  <rect x="44" y="96" width="150" height="44" rx="6" fill="#24272b" stroke="#4ea8de"/>
  <text x="119" y="116" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12" font-weight="700">数学/代码难题 q</text>
  <text x="119" y="132" text-anchor="middle" fill="#9aa0a6" font-family="monospace" font-size="10">Prompt + 单元测试</text>

  <line x1="194" y1="118" x2="226" y2="118" stroke="#2bbc8a" stroke-width="1.6" marker-end="url(#arr8)"/>

  <rect x="230" y="96" width="180" height="44" rx="6" fill="#24272b" stroke="#c678dd"/>
  <text x="320" y="116" text-anchor="middle" fill="#c678dd" font-family="sans-serif" font-size="12" font-weight="700">同题采样 G 条思维链</text>
  <text x="320" y="132" text-anchor="middle" fill="#9aa0a6" font-family="monospace" font-size="10">{o₁, o₂, ..., o_G}</text>

  <line x1="320" y1="140" x2="320" y2="168" stroke="#2bbc8a" stroke-width="1.6" marker-end="url(#arr8)"/>

