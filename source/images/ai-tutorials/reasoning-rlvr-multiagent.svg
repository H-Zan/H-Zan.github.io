  <text x="320" y="213" text-anchor="middle" fill="#d5ff80" font-family="monospace" font-size="10.5">rᵢ ∈ {0, 1} (代码通过/答案对)</text>

  <line x1="230" y1="198" x2="198" y2="198" stroke="#2bbc8a" stroke-width="1.6" marker-end="url(#arr8)"/>

  <rect x="44" y="172" width="150" height="52" rx="6" fill="#24272b" stroke="#f0a500"/>
  <text x="119" y="194" text-anchor="middle" fill="#f0a500" font-family="sans-serif" font-size="12" font-weight="700">组内相对优势 Aᵢ</text>
  <text x="119" y="213" text-anchor="middle" fill="#eeeeee" font-family="monospace" font-size="10">(rᵢ - mean) / std</text>

  <rect x="44" y="242" width="366" height="54" rx="6" fill="#24272b" stroke="#363b42"/>
  <text x="227" y="263" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="11.5" font-weight="700">省去庞大 Critic 网络，直接强化高分推理轨迹</text>
  <text x="227" y="283" text-anchor="middle" fill="#2bbc8a" font-family="sans-serif" font-size="10.5">→ 涌现“自我检验、回溯纠错、Test-Time Compute 思考扩展”</text>

  <!-- Right: Multi-Agent Orchestration -->
  <rect x="450" y="56" width="406" height="258" rx="10" fill="#1e2422" stroke="#2bbc8a" stroke-width="1.5"/>
