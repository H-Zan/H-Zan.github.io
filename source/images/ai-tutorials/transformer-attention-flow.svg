<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2bbc8a"/>
    </marker>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#22262b"/>
    </linearGradient>
  </defs>
  <rect width="880" height="350" rx="12" fill="url(#bg5)" stroke="#363b42" stroke-width="1.5"/>
  <text x="440" y="32" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="16" font-weight="700">Transformer Block 与 Scaled Dot-Product Attention 内部数据流</text>
  <text x="440" y="52" text-anchor="middle" fill="#9aa0a6" font-family="monospace" font-size="11.5">Attention(Q, K, V) = softmax( (Q · Kᵀ) / √d_k + CausalMask ) · V</text>

  <!-- Input X -->
  <rect x="26" y="140" width="98" height="72" rx="8" fill="#24272b" stroke="#4ea8de" stroke-width="1.5"/>
  <text x="75" y="168" text-anchor="middle" fill="#4ea8de" font-family="monospace" font-size="12" font-weight="700">Input X</text>
  <text x="75" y="186" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="11">RMSNorm</text>
  <text x="75" y="202" text-anchor="middle" fill="#9aa0a6" font-family="monospace" font-size="10">[B, L, d]</text>

  <!-- Q K V boxes -->
  <line x1="124" y1="158" x2="164" y2="108" stroke="#2bbc8a" stroke-width="1.6" marker-end="url(#arr5)"/>
  <line x1="124" y1="176" x2="164" y2="176" stroke="#2bbc8a" stroke-width="1.6" marker-end="url(#arr5)"/>
  <line x1="124" y1="194" x2="164" y2="244" stroke="#2bbc8a" stroke-width="1.6" marker-end="url(#arr5)"/>

  <rect x="168" y="80" width="128" height="52" rx="6" fill="#24272b" stroke="#2bbc8a"/>
  <text x="232" y="102" text-anchor="middle" fill="#2bbc8a" font-family="monospace" font-size="12" font-weight="700">Q = X·W_Q + RoPE</text>
  <text x="232" y="120" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="10.5">Query · 我在找什么</text>

  <rect x="168" y="150" width="128" height="52" rx="6" fill="#24272b" stroke="#f0a500"/>
  <text x="232" y="172" text-anchor="middle" fill="#f0a500" font-family="monospace" font-size="12" font-weight="700">K = X·W_K + RoPE</text>
  <text x="232" y="190" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="10.5">Key · 我有什么标签</text>

  <rect x="168" y="220" width="128" height="52" rx="6" fill="#24272b" stroke="#c678dd"/>
  <text x="232" y="242" text-anchor="middle" fill="#c678dd" font-family="monospace" font-size="12" font-weight="700">V = X·W_V</text>
  <text x="232" y="260" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="10.5">Value · 我的实际内容</text>

  <!-- QK^T / sqrt(dk) -->
  <line x1="296" y1="106" x2="340" y2="128" stroke="#2bbc8a" stroke-width="1.6" marker-end="url(#arr5)"/>
  <line x1="296" y1="176" x2="340" y2="152" stroke="#2bbc8a" stroke-width="1.6" marker-end="url(#arr5)"/>

  <rect x="344" y="96" width="144" height="84" rx="8" fill="#1e2422" stroke="#2bbc8a" stroke-width="1.5"/>
  <text x="416" y="120" text-anchor="middle" fill="#eeeeee" font-family="monospace" font-size="12" font-weight="700">Q·Kᵀ / √d_k</text>
  <text x="416" y="140" text-anchor="middle" fill="#f0a500" font-family="sans-serif" font-size="11">+ 因果掩码 Mask</text>
  <text x="416" y="158" text-anchor="middle" fill="#2bbc8a" font-family="monospace" font-size="11">→ Softmax 权重</text>
  <text x="416" y="173" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="9.5">防梯度饱和、防偷看未来</text>

  <!-- Weighted sum with V -->
  <line x1="488" y1="142" x2="532" y2="168" stroke="#2bbc8a" stroke-width="1.6" marker-end="url(#arr5)"/>
  <line x1="296" y1="246" x2="532" y2="196" stroke="#c678dd" stroke-width="1.6" marker-end="url(#arr5)"/>

  <rect x="536" y="140" width="132" height="78" rx="8" fill="#24272b" stroke="#c678dd" stroke-width="1.5"/>
  <text x="602" y="166" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12" font-weight="700">多头拼接投影</text>
  <text x="602" y="185" text-anchor="middle" fill="#c678dd" font-family="monospace" font-size="11">Concat(H₁..Hₙ)W_O</text>
  <text x="602" y="204" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="10">+ 残差连接 (Add)</text>

  <!-- FFN / MoE -->
  <line x1="668" y1="179" x2="704" y2="179" stroke="#2bbc8a" stroke-width="1.8" marker-end="url(#arr5)"/>

  <rect x="708" y="122" width="146" height="114" rx="8" fill="#24272b" stroke="#f0a500" stroke-width="1.6"/>
  <text x="781" y="148" text-anchor="middle" fill="#f0a500" font-family="monospace" font-size="11.5" font-weight="700">FFN / MoE 层</text>
  <text x="781" y="168" text-anchor="middle" fill="#eeeeee" font-family="sans-serif" font-size="12" font-weight="700">SwiGLU / 稀疏专家</text>
  <text x="781" y="188" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="10.5">Router 仅激活 Top-2</text>
  <text x="781" y="206" text-anchor="middle" fill="#9aa0a6" font-family="sans-serif" font-size="10.5">知识提取与非线性变换</text>
  <text x="781" y="224" text-anchor="middle" fill="#2bbc8a" font-family="monospace" font-size="10">+ Residual → 下一层</text>

  <!-- Residual highway -->
  <path d="M 75 212 L 75 298 L 602 298 L 602 222" fill="none" stroke="#4ea8de" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr5)"/>
  <text x="340" y="292" text-anchor="middle" fill="#4ea8de" font-family="sans-serif" font-size="10.5">残差高速通道 (Residual Stream)：确保百层网络梯度畅通无阻</text>

  <text x="440" y="332" text-anchor="middle" fill="#888e96" font-family="sans-serif" font-size="11">Attention 负责在 Token 之间“路由信息”，FFN/MoE 负责在每个 Token 内部“检索与加工知识”</text>
</svg>
